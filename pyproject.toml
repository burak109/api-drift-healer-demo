[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-drift-healer"
version = "1.3.0"
description = "A local-first CLI for safely detecting and healing OpenAPI drift in YAML tests, Postman collections, .http files, and Python requests tests."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask",
    "requests",
    "PyYAML",
    "typer",
]

[project.optional-dependencies]
pytest = [
    "pytest",
]

[project.scripts]
api-drift-healer = "api_drift_healer.cli:app"

[tool.setuptools]
py-modules = [
    "auto_healer",
    "field_matcher",
    "test_runner",
    "mock_server",
]

[tool.setuptools.packages.find]
include = ["api_drift_healer*"]