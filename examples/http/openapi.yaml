openapi: 3.0.0

info:
  title: HTTP Adapter Demo API
  version: 1.0.0

paths:
  /users:
    post:
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email_address
              properties:
                name:
                  type: string
                email_address:
                  type: string
                  format: email
      responses:
        "201":
          description: User created