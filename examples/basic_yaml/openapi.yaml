openapi: 3.0.0
info:
  title: Dummy User API
  version: 1.0.0
paths:
  /users:
    post:
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email_address
              properties:
                email_address:
                  type: string
                  format: email
                name:
                  type: string
      responses:
        '201':
          description: User created
        '400':
          description: Bad Request