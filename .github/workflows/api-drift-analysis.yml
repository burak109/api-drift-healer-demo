name: API Drift Analysis

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Test and analyze API drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pytest]"

      - name: Run test suite
        run: |
          python -m unittest discover -s . -p "test*.py"

      - name: Capture source hashes
        shell: bash
        run: |
          find examples/python_batch_v1_4 \
            -maxdepth 1 \
            -type f \
            -name 'test_*.py' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/api-drift-before.sha256

      - name: Run read-only drift analysis
        id: drift_analysis
        continue-on-error: true
        run: |
          api-drift-healer pytest batch \
            --directory examples/python_batch_v1_4 \
            --openapi examples/python_batch_v1_4/openapi.json \
            --timeout 30 \
            --report-file .api-drift-healer/report.txt \
            --report-markdown .api-drift-healer/report.md \
            --report-json .api-drift-healer/report.json

      - name: Verify source preservation
        if: always()
        run: |
          sha256sum --check \
            /tmp/api-drift-before.sha256

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [[ -f .api-drift-healer/report.md ]]; then
            cat .api-drift-healer/report.md \
              >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# API Drift Healer Batch Report"
              echo
              echo "The analyzer did not produce a Markdown report."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-drift-healer-reports
          path: |
            .api-drift-healer/report.txt
            .api-drift-healer/report.md
            .api-drift-healer/report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce analyzer result
        if: steps.drift_analysis.outcome == 'failure'
        run: |
          echo "API Drift Healer analysis failed."
          exit 1
