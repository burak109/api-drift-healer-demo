name: API Drift Analysis

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Test and analyze API drift
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NO_COLOR: "1"
      TYPER_USE_RICH: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Capture source hashes
        shell: bash
        run: |
          find examples/python_batch_v1_4 \
            -maxdepth 1 \
            -type f \
            -name 'test_*.py' \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > /tmp/api-drift-before.sha256

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pytest]"

      - name: Run test suite
        id: unit_tests
        continue-on-error: true
        run: |
          python -m unittest discover -s . -p "test*.py"

      - name: Run read-only drift analysis
        id: drift_analysis
        continue-on-error: true
        run: |
          api-drift-healer pytest batch \
            --directory examples/python_batch_v1_4 \
            --openapi examples/python_batch_v1_4/openapi.json \
            --timeout 30 \
            --report-file .api-drift-healer/report.txt \
            --report-markdown .api-drift-healer/report.md \
            --report-json .api-drift-healer/report.json

      - name: Verify source preservation
        if: always()
        run: |
          sha256sum --check \
            /tmp/api-drift-before.sha256

      - name: Write pull request context
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import string
          from pathlib import Path

          def positive_integer(name: str) -> int:
              value = int(os.environ[name])

              if value <= 0:
                  raise SystemExit(
                      f"{name} must be positive."
                  )

              return value

          def git_sha(name: str) -> str:
              value = os.environ[name].strip().lower()

              if (
                  len(value) not in {40, 64}
                  or any(
                      character not in string.hexdigits
                      for character in value
                  )
              ):
                  raise SystemExit(
                      f"{name} is not a valid Git SHA."
                  )

              return value

          repository = os.environ[
              "REPOSITORY"
          ].strip()

          if (
              repository.count("/") != 1
              or repository.startswith("/")
              or repository.endswith("/")
          ):
              raise SystemExit(
                  "REPOSITORY must use owner/name format."
              )

          payload = {
              "schema_version": 1,
              "pull_request_number": (
                  positive_integer("PR_NUMBER")
              ),
              "repository": repository,
              "workflow_run_id": (
                  positive_integer(
                      "WORKFLOW_RUN_ID"
                  )
              ),
              "workflow_run_head_sha": git_sha(
                  "WORKFLOW_RUN_HEAD_SHA"
              ),
              "pull_request_head_sha": git_sha(
                  "PULL_REQUEST_HEAD_SHA"
              ),
          }

          output_path = Path(
              ".api-drift-healer/pr-context.json"
          )
          output_path.parent.mkdir(
              parents=True,
              exist_ok=True,
          )
          output_path.write_text(
              json.dumps(
                  payload,
                  indent=2,
                  ensure_ascii=False,
              )
              + "\n",
              encoding="utf-8",
          )

          print(
              "Pull request context created."
          )
          PY

      - name: Publish job summary
        if: always()
        shell: bash
        run: |
          if [[ -f .api-drift-healer/report.md ]]; then
            cat .api-drift-healer/report.md \
              >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "# API Drift Healer Batch Report"
              echo
              echo "The analyzer did not produce a Markdown report."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-drift-healer-reports
          path: |
            .api-drift-healer/report.txt
            .api-drift-healer/report.md
            .api-drift-healer/report.json
            .api-drift-healer/pr-context.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce workflow result
        if: always()
        shell: bash
        run: |
          failed=0

          if [[ "${{ steps.unit_tests.outcome }}" == "failure" ]]; then
            echo "Unit test suite failed."
            failed=1
          fi

          if [[ "${{ steps.drift_analysis.outcome }}" == "failure" ]]; then
            echo "API Drift Healer analysis failed."
            failed=1
          fi

          exit "$failed"
